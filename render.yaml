services:
  - type: web
    name: onedw-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: APP_NAME
        value: OneDW API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: API_V1_PREFIX
        value: /api/v1
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: onedw
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: CORS_ALLOW_METHODS
        value: '["*"]'
      - key: CORS_ALLOW_HEADERS
        value: '["*"]'
      - key: SOCKETIO_CORS_ORIGINS
        value: '["*"]'
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
